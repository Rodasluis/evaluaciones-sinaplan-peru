correcciones:
- indicador: IOP.05.02
  anio: 2024
  valor: 1.98
  sustento: El valor registrado, 101,98, es el cociente A/B × 100 (3 612 / 3 542). Con la fórmula de la ficha, ((A
    − B) / B) × 100, corresponde 1,98. El RC 2024 no analiza el indicador por esa razón (análisis de suficiencia
    del 27-10-2026, sección 2.6).
