notas_rs:
- indicador: ISS.01.02.02.02
  anio: 2021
  nota: Los RS 2023 a 2025 consignan 38,3, que es la meta de la ficha anterior (Acta N.° 003-2023, Anexo 1, que
    medía redes de hombres con acciones sostenidas). El acta ratificada redefinió el indicador por distritos y fijó
    metas nuevas (Anexo 2, p. 8 del PDF); los valores reportados desde 2023 ya se miden con la ficha nueva, por
    lo que el RS compara una meta y un valor de definiciones distintas. El RS 2025 sí usa la meta nueva para 2025
    (84,5).
