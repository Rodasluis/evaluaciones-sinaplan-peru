# Asignaciones identificadas por coincidencia de monto que se descartan por falta de correspondencia funcional entre la
# meta del MEF y el servicio (revisión institucional del 13-11-2026).
asignacion_descartada:
  6.4.1: El monto del LIO 2022 coincide con el devengado de la meta «26 servicios de atención a afectados por la
    violencia familiar», que no financia el acompañamiento y la consejería a las familias del servicio.
