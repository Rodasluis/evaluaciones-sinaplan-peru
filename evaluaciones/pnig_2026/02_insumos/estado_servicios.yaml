      2022, p. 151) y línea de base y propuesta de protocolo en 2023–2025.'
  6.4.1:
    estado: No implementado
    motivo: El servicio como tal siguió en diseño durante todo el periodo, sin protocolo (LIO 2022, p. 171; LIO
      2023, p. 163; LIO 2025, p. 25); los servicios del INABIF y las capacitaciones del SIEF que reportan los informes
      LIO son actividades conexas y no constituyen su provisión (revisión institucional del 13-11-2026).
